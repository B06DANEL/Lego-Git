<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    version="1.1" 
    preserveAspectRatio="xMidYMid meet"
    viewBox="0 0 148 87"><style>
* {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  word-wrap: break-word;
}
.blocklyPath {
  stroke-width: 1px;
}
.blocklyText {
  fill: rgb(255, 255, 255);
  font-family: "Helvetica Neue", Helvetica, sans-serif;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -0.4px;
}

[data-category='flipperlight'] .blocklyText {
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.12), 1px -1px 0 rgba(0, 0, 0, 0.12),
    -1px 1px 0 rgba(0, 0, 0, 0.12), 1px 1px 0 rgba(0, 0, 0, 0.12);
}
[data-category='sounds'] .blocklyText,
[data-category='flippersound'] .blocklyText {
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.26), 1px -1px 0 rgba(0, 0, 0, 0.26),
    -1px 1px 0 rgba(0, 0, 0, 0.26), 1px 1px 0 rgba(0, 0, 0, 0.26);
}
[data-category='flipperevents'] .blocklyText,
[data-category='events'] .blocklyText {
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.42), 1px -1px 0 rgba(0, 0, 0, 0.42),
    -1px 1px 0 rgba(0, 0, 0, 0.42), 1px 1px 0 rgba(0, 0, 0, 0.42);
}
[data-category='operators'] .blocklyText{
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.26), 1px -1px 0 rgba(0, 0, 0, 0.26),
    -1px 1px 0 rgba(0, 0, 0, 0.26), 1px 1px 0 rgba(0, 0, 0, 0.26);
}
[data-category='flippermotor'] .blocklyText,
[data-category='flippermoremotor'] .blocklyText {
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.16), 1px -1px 0 rgba(0, 0, 0, 0.16),
    -1px 1px 0 rgba(0, 0, 0, 0.16), 1px 1px 0 rgba(0, 0, 0, 0.16);
}
[data-category='flippermove'] .blocklyText,
[data-category='flippermoremove'] .blocklyText {
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.21), 1px -1px 0 rgba(0, 0, 0, 0.21),
    -1px 1px 0 rgba(0, 0, 0, 0.21), 1px 1px 0 rgba(0, 0, 0, 0.21);
}
[data-category='flippercontrol'] .blocklyText,
[data-category='control'] .blocklyText {
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.39), 1px -1px 0 rgba(0, 0, 0, 0.39),
    -1px 1px 0 rgba(0, 0, 0, 0.39), 1px 1px 0 rgba(0, 0, 0, 0.39);
}
[data-category='flippersensors'] .blocklyText,
[data-category='flippermoresensors'] .blocklyText {
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.37), 1px -1px 0 rgba(0, 0, 0, 0.37),
    -1px 1px 0 rgba(0, 0, 0, 0.37), 1px 1px 0 rgba(0, 0, 0, 0.37);
}
[data-category='flippermusic'] .blocklyText,
[data-category='weather'] .blocklyText,
[data-category='linegraphmonitor'] .blocklyText,
[data-category='bargraphmonitor'] .blocklyText,
[data-category='displaymonitor'] .blocklyText {
  text-shadow: -1px -1px 0 rgba(0, 0, 0, 0.27), 1px -1px 0 rgba(0, 0, 0, 0.27),
    -1px 1px 0 rgba(0, 0, 0, 0.27), 1px 1px 0 rgba(0, 0, 0, 0.27);
}
.blocklyDropdownText {
  fill: rgb(255, 255, 255) !important;
}

.blocklyEditableText > .blocklyText:not(.blocklyDropdownText),
.blocklyFlyoutButton > .blocklyText {
  text-shadow: none;
}

.blocklyNonEditableText > text, .blocklyEditableText > text {
  fill: rgb(87, 94, 117);
}
.scratchCommentForeignObject {
  background-color: #fff9d9;
}
.scratchCommentTextarea {
  color: #a9983e;
  background-color: #fff9d9;
  width: 100%;
  height: 100%;
  padding: 12px;
  box-sizing: border-box;
}

.scratchCommentText {
  font-size: 16px;
  fill: #fff9d9;
  font-family: "Helvetica Neue", Helvetica, sans-serif;
}
.scratchCommentBody {
  background-color: #fff9d9; }
.scratchCommentTopBar {
  fill: #fff2ae;
  fill-opacity: 0.1}
.scratchCommentRect {
  fill: #fff2ae; }
.scratchWorkspaceCommentBorder {
  stroke: #fff2ae; }
.scratchCommentTopBar ~ use, .scratchCommentTopBar ~ image {
  opacity: 0.4; }
.scratchCommentTarget {
  display: none;
}
.scratchCommentResizeSE, .scratchCommentResizeSW {
  fill: transparent;
}
.blocklyResizeLine {
  stroke: #888;
  stroke-width: 1;
}
@import '~#root/lls/styles/index.scss';

g[data-category^='doodle'] > path {
  fill: white;
  stroke-width: 2;
  stroke-dasharray: 6;
}
g[data-category^='doodle-'] > .blocklyText {
  /*
   * The doodle block label is padded with dots to make it longer.
   * clip-path makes the dots invisible.
   */
  clip-path: inset(0 4px 0 4px);
  text-shadow: none !important;
  fill: $color-grey-10;
}

g[data-category='doodle-any'] > .blocklyText {
  fill: white;
}
</style><g xmlns="http://www.w3.org/2000/svg" class="blocklyWorkspace" transform="translate(-515.25,-262.8625183105469)"><g class="blocklyBlockCanvas" transform="translate(430,120) scale(0.675)"><g data-id="dEOklzkSxZ2iBzAXXzr6" class="blocklyDraggable" data-shapes="hat" data-category="flipperevents" transform="translate(126.2962962962963,228.14814814814815)"><path class="blocklyPath blocklyBlockBackground" stroke="#B09400" fill="#F5C402" fill-opacity="1" d="m 0,0 c 25,-22 71,-22 96,0 H 214.75845336914062 a 4,4 0 0,1 4,4 v 40  a 4,4 0 0,1 -4,4 H 48   c -2,0 -3,1 -4,2 l -4,4 c -1,1 -2,2 -4,2 h -12 c -2,0 -3,-1 -4,-2 l -4,-4 c -1,-1 -2,-2 -4,-2 H 4 a 4,4 0 0,1 -4,-4 z"/><g transform="translate(8, 4) "><use xlink:href="#756b7a55acc8a4692c0d1941952bb8a743274820"/></g><g transform="translate(56, 4) "><line stroke="#C8A300" stroke-linecap="round" x1="0" y1="0" x2="0" y2="36"/></g><text class="blocklyText" y="2" text-anchor="middle" dominant-baseline="middle" dy="0" x="72.87922668457031" transform="translate(65, 24) ">when program starts</text><g data-id="2;;4t7%14R#jxmlE]0FS" class="blocklyDraggable" data-shapes="stack" data-category="flipperlight" transform="translate(0,48)"><path class="blocklyPath blocklyBlockBackground" stroke="#571CC1" fill="#9B6AF6" fill-opacity="1" d="m 0,4 A 4,4 0 0,1 4,0 H 12 c 2,0 3,1 4,2 l 4,4 c 1,1 2,2 4,2 h 12 c 2,0 3,-1 4,-2 l 4,-4 c 1,-1 2,-2 4,-2 H 158.55555725097656 a 4,4 0 0,1 4,4 v 48  a 4,4 0 0,1 -4,4 H 48   c -2,0 -3,1 -4,2 l -4,4 c -1,1 -2,2 -4,2 h -12 c -2,0 -3,-1 -4,-2 l -4,-4 c -1,-1 -2,-2 -4,-2 H 4 a 4,4 0 0,1 -4,-4 z"/><g data-id="r~e+Q|[VqAJFDt#Ka{^@" data-argument-type="text" data-shapes="argument round" transform="translate(106.77777862548828,12)"><path class="blocklyPath blocklyBlockBackground" stroke="#571CC1" fill="#FFFFFF" fill-opacity="1" d="m 0,0 m 16,0 H 31.77777862548828 a 16 16 0 0 1 0 32 H 16 a 16 16 0 0 1 0 -32 z"/><g class="blocklyEditableText" transform="translate(8, 0) " style="cursor: text;"><text class="blocklyText" x="15.88888931274414" y="18" dominant-baseline="middle" dy="0" text-anchor="middle">test</text></g></g><g transform="translate(8, 12) "><use xlink:href="#9f4dc2534a8b93548016f0c5eaa0ca37e40dc360"/></g><g transform="translate(56, 8) "><line stroke="#691FF0" stroke-linecap="round" x1="0" y1="0" x2="0" y2="40"/></g><text class="blocklyText" y="2" text-anchor="middle" dominant-baseline="middle" dy="0" x="16.88888931274414" transform="translate(65, 28) ">write</text><path class="blocklyPath" style="visibility: hidden" d="" fill="#571CC1"/></g></g></g><g class="blocklyBubbleCanvas" transform="translate(430,120) scale(0.675)"/><defs><image height="40px" width="40px" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="data:image/svg+xml;base64," id="756b7a55acc8a4692c0d1941952bb8a743274820"/><image height="40px" width="40px" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="data:image/svg+xml;base64," id="9f4dc2534a8b93548016f0c5eaa0ca37e40dc360"/></defs></g></svg>
